[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdtf-comparer"
version = "0.1.0"
description = "Compare GDTF fixture files side by side"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.2",
    "pygdtf==1.4.5",
    "defusedxml==0.7.1",
    "qt-material==2.17",
    "pymvr==1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pyinstaller==6.22.3",
]

[project.gui-scripts]
gdtf-comparer = "gdtf_comparer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -ra"
qt_api = "pyside6"
